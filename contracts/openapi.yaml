      summary: 'Report a wrong number (publisher-error, transformation-error) or ask to hide your home (privacy-objection:
        uprn or addressId + email; confirmed by e-mail link)'
      description: 'publisher-error / transformation-error reports are stored in correction_report and forwarded to the operator
