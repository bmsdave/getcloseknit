openapi: 3.1.0
info:
  title: London Close Knit API
  description: 'Evidence-backed UK area and property intelligence for people and agents. v1 serves the map; /api/v2/tools/{name}
    and the MCP endpoint at /mcp serve agents with the evidence envelope (value, confidence, evidence[], sources[], caveats[]).


    Versioning policy (AE-35): paths carry the major version (/api/v1) and every payload carries a schemaVersion envelope
    constant. Within one schemaVersion only optional additive fields may appear; clients MUST ignore unknown fields and servers
    MUST keep sending documented required fields. A breaking change mints a new path major or a new schemaVersion and the
    previous shape keeps serving until its documented retirement. Optional valuations may be null or omitted; a missing valuation
    is unavailable, never zero: clients map missing/null to "not published", never to a numeric default. Property identity
    is the UPRN string and clients preserve it verbatim: no numeric coercion, no trimming. Golden fixtures under contracts/fixtures/golden-v1
    pin the shared shapes.


    This document is generated from the API (deploy/tools/gen_openapi.py, models in api/area_api/contract). Schemas list the
    fields documented so far; an answer may carry more. Paths marked x-status web-fixture are served by the Next.js BFF on
    fixtures, not by this API.


    Coverage (CLOSE_KNIT_ENGLAND, FLAGS.md): London, or all of England with the flag on. Every regional percentile, rank,
    share or median (regionPercentile, regionMedian, regionShare...) is computed within the area''s region (ONS region, E12000001-E12000009),
    so a London area keeps its London figures. Renamed in step R1 (docs/architecture/global-geography.md): londonPercentile
    -> regionPercentile, englandPercentile -> countryPercentile, london<X> -> region<X>, and the kind, carrier and level borough
    -> lad. For one contract version every answer also carries each old field name next to the new one with the same value
    (deprecated; such answers send the Deprecation header; Sunset once its date is set), and ?carrier= / ?level= still take
    borough for lad. Step R2 renamed the ids: uk:borough:<code> -> uk:lad:<code>. Answers name uk:lad: ids; every route, body
    and tool still takes an old uk:borough: id and answers for its LAD (page URLs /area/borough/... move 301 to /area/lad/...).
    Area tile URLs and their layer keep borough. Every /api/v1/areas/{id} route (and its sub-routes) adds rankScope {code,
    name}: the region those figures are computed in (null for an area the region table does not know). With the flag off an
    area outside London is area-not-found and lists, packs, shapes and searches hold London''s areas only. Places a source
    covers in London only (TfL, ULEZ, LAEI air, GLA layers, council admissions, HMO registers, Inside Airbnb) read null elsewhere;
    reasons say outside-coverage instead of outside-london with the flag on.'
  license: {name: Apache-2.0, identifier: Apache-2.0}
  version: 2.0.0
