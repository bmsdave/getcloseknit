        a range card, for layers without a map value pack (noise from area_noise, disorder, schools, EPC and leasehold shares)
        as well as map metrics'
      description: 'The histogram behind a range card: a map metric''s latest values, or for a layer with no map value pack
        the My match factor of the same name (noise from area_noise before the Noise map layer is loaded, disorder, schools,
        growth-outlook, epc-share, leasehold-share). Census layers and own criteria (custom:) are not criteria here.'
      operationId: getMatchCriterionValues
