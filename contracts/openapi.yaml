        or more homes); a sold home (a dwelling or a parcel of one home) carries band, its last sale''s coarse band 0-5 against
        same-type sales in its area that year; no per-home value or £/m² (migration 044)'
      operationId: getPropertyTile
      parameters:
      - name: z
        in: path
