        '400': {description: 'invalid-query (not an LSOA, or malformed outsideZones)'}
        '404': {description: area-not-found}
        '503': {description: release-unavailable}
        '422':
          description: Validation Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HTTPValidationError'}
