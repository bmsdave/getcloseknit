      summary: 'The box index of a map chunk (area-boxes.v1): each area''s [id, west, south, east, north] for a carrier, in
        a region or LAD chunk (?chunk=, map-coverage.v1) or every area. The shapes are the area vector tiles (/api/v1/tiles/areas)'
