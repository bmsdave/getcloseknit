  /api/v2/downloads/places.csv:
    get:
      tags: [downloads]
      summary: 'The unified places database as CSV under ODbL 1.0 (share-alike: it contains OpenStreetMap data): every place
        behind the place tiles with id, name, category, group, brand, sources, confidence, score, specialty_score, hygiene_rating,
        lsoa_id, lon, lat, the OSM / FSA / Overture / Foursquare ids, tags (JSON) and source release; ''#'' notice lines precede
        the header. Rate limited to a few downloads per hour'
      description: 'Offered because the place tiles and nearby lists are produced from a database that contains OpenStreetMap
        data (ODbL share-alike). Lines starting with "# " carry the licence notice and the sources'' attribution, then a CSV
        header: id, name, category, group, brand, sources (;-joined), confidence, score, specialty_score, hygiene_rating,
        lsoa_id, lon, lat, osm_id, fhrs_id, overture_id, fsq_id, tags (JSON), source_release_id. Built once per place release;
        rate class "download" (2/minute, 4/hour, 10/day per client).'
      operationId: downloadPlaces
      responses:
        '200':
          description: Attachment (Content-Disposition), Cache-Control public max-age=86400, Link rel=license
          content:
            text/csv:
              schema: {type: string}
        '429': {description: rate-limited}
        '503': {description: release-unavailable | query-timeout}
  /api/v1/matches:
    post:
      summary: 'My match: every area scored against an ordered list of criteria (preference-profile v2, or v1 migrated): fit
        per criterion with soft edges, weights from the order, Musts as filters, rank and percentile among scored areas, the
        top 2 reasons, the 2 weakest criteria and the bottom 10. sort=best-value orders the better half by good value for
        the home type (area level only). ?regions=E12000007,E12000008 scores the areas of those regions only (CLOSE_KNIT_ENGLAND;
        default all of England, London alone with the flag off), filtered in the database'
      description: 'One model for every criterion. Each criterion gives an area a fit in [0, 1]: 1 inside its range, falling
        linearly to 0 across its soft edge, 0 beyond. A Must criterion (edges at 0) is a filter with no weight: outside it
        the area is excluded (unmetLimits "<id>:outside" or "<id>:missing", relaxable). The other criteria are ranked by their
        place in the list: weights are the rank-order centroid w_i = 1/n * sum_{k=i..n} 1/k. Score = 100 x the weighted geometric
        mean of the fits (a ranked criterion with no evidence counts as a fit of 0.5); a fit of 0 makes the score 0 (scored,
        never out). Ties break by the criteria in order (better fit, then better value). Each scored area gets its rank and
        percentile among the scored areas, its top 2 contributing criteria (reasons) and its 2 weakest; the pack lists the
        bottom 10. A preference-profile.v1 is migrated first (weights become the order, Must stays Must, a wizard factor becomes
        a percentile range on its own evidence, zones become the first Where criterion). sort=best-value orders the scored
        areas in the better half by good value for the home type (area_good_value, migration 069; value ratios outside 0.6-1.67
        are trimmed), the rest after them by score. Area level only, never one home.'
      operationId: createMatches
      parameters:
      - name: sort
        in: query
        required: false
        schema:
          enum: [score, best-value]
          type: string
          default: score
      - name: homeType
        in: query
        required: false
        schema:
          anyOf:
          - {type: string}
          - {type: 'null'}
      - name: regions
        in: query
        required: false
        schema:
          anyOf:
          - {type: string}
          - {type: 'null'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MatchRequest'}
      responses:
        '200':
          description: Complete match pack
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MatchPack'}
        '202': {description: Route matrices are being calculated}
        '400': {description: 'Invalid profile, or an unknown region code'}
        '422':
          description: Validation Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HTTPValidationError'}
  /api/v1/portal-links:
    post:
