      description: OpenStreetMap places tagged amenity university or college with a name (the merged places table, migration
        034; confidence 0.6 or more), drawn from zoom 13 while Student areas (student-share) colours the map. Empty before
        the places table is loaded. © OpenStreetMap contributors, ODbL 1.0.
      operationId: getUniversityPoints
