      description: '12-month standard sales, turnover (share of EPC-linked homes that sold), the leasehold share of SALES
        (not of homes), new-build and resale median £/m² over 36 months with the new-build premium (each median needs 10 sales;
        the premium needs both), and the LSOA''s £/m² index growth. Aggregates only: no valuation, no listing, no address.
        Boroughs and areas without released depth answer with value.available false. Answers in the EvidenceEnvelope.'
      operationId: getAreaMarket
      parameters:
      - name: area_id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: EvidenceEnvelope (schemaVersion area-market.v1) whose value is AreaMarket
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AreaMarketResponse'}
        '400': {description: invalid-query}
        '404': {description: area-not-found}
        '503': {description: release-unavailable}
        '422':
          description: Validation Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HTTPValidationError'}
  /api/v1/areas/{area_id}/pack:
    get:
      summary: 'Area evidence pack: market depth, crime, noise, nearby schools and growth; with ?address= also that address''s
        building and street sale aggregates (evidence envelope)'
      description: Market depth (as /market), the latest recorded crime rate, road and rail noise shares, state schools within
        1.5 km (latest Ofsted outcome, no admission claim) and, with ?address=, that address's building and street sale aggregates
        (counts and gated medians, no sale rows). The address must lie inside the area.
