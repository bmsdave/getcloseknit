      - name: y
        in: path
        required: true
        schema: {type: integer}
      responses:
        '200':
          description: Mapbox Vector Tile; blocks carry id, area (m²), dwellings and ppm (median £/m², only over three or
            more homes); parcels/dwellings carry uprn, address_id, latest_sale, address (zoom 16+) and, for a sold home (a
            dwelling or a parcel of one home), band (0 = bottom 10% … 5 = top 10% of same-type sales in its area that year),
