      description: 'Each state-funded school without a successor (kind state), then each open mainstream independent school
        once migration 067 is loaded (kind independent), for the map''s Show › Schools icons and hover popup. stage is primary,
        secondary or all-through (ages from under 10 to 16+). Optional fields are left out when empty: ofsted (state only:
        the school card''s standing inspection, so an ungraded visit leaves the grade before it: outstanding, good, requires-improvement,
        inadequate from the legacy overall grade, or report-card; none for 2024-25 graded areas without an overall grade),
        topPercent (state only: England rank''s top % in the phase''s latest year, 25 or better), selective, faith (GIAS religious
        character), sixthForm, intake ("Girls", "Boys", or "Girls · mixed sixth form" when the census counts the other sex
        at a single-sex school with a sixth form).'
      operationId: getSchoolPoints
