  /api/v1/map/coverage:
    get:
      summary: 'Where the map can go and the chunks it loads its shapes and colours in (map-coverage.v1): England''s regions
        and LADs behind CLOSE_KNIT_ENGLAND, else London''s bounds and no chunks'
      description: '{schemaVersion, coverage: england|london, productReleaseId, bounds: [[west, south], [east, north]], regions:
