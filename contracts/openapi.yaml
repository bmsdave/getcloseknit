          - {type: 'null'}
      responses:
        '200':
          description: EvidenceEnvelope (schemaVersion area-evidence-pack.v1) whose value is AreaEvidencePack
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AreaEvidencePackResponse'}
        '400': {description: 'invalid-query (malformed id, or the address is not in the area)'}
        '404': {description: area-not-found | address-not-found}
        '503': {description: release-unavailable}
        '422':
          description: Validation Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HTTPValidationError'}
  /api/v1/areas/{area_id}/similar:
    get:
      summary: Up to ten LSOAs with the closest London percentiles for crime, deprivation, income, price level and walk to
        a station (never demographic composition); ?cheaper=true keeps a lower price per m², ?outsideZones=<zones JSON> leaves
        out areas inside those zones, ?socialRenting=true also compares the social-renting share
      description: Up to ten LSOAs whose London percentiles (the personal-match utilities) for crime, deprivation, household
        income, price per m² (market level) and walk to a station sit closest to this LSOA's, by root-mean-square percentile
        distance. Demographic composition is never compared; social renting joins only with socialRenting=true. cheaper=true
        keeps areas with a lower market-level price per m². outsideZones carries the profile's zones array as JSON and leaves
        out every LSOA inside those zones (the response is then not cacheable).
      operationId: getSimilarAreas
      parameters:
      - name: area_id
        in: path
        required: true
        schema: {type: string}
      - name: cheaper
        in: query
        required: false
        schema: {type: boolean, default: false}
      - name: outsideZones
        in: query
        required: false
        schema:
          anyOf:
          - {type: string}
          - {type: 'null'}
      - name: socialRenting
        in: query
        required: false
        schema: {type: boolean, default: false}
