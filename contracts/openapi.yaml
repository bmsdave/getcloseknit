  /api/v1/schools/{urn}/card:
    get:
      summary: 'One school''s card: results by year against London (percentiles, medians), Top school badge, dated Ofsted
        extracts and every council''s last distance offered with its source'
      description: 'school_summary with topBadge, school_history, percentiles and London medians per measure and year (London
        state schools of the same phase, cohort 30+, suppressed figures left out), KPI tiles, short dated Ofsted extracts
        (whole sentences, 160 characters or fewer, at most three each), and every council''s last distance offered per year
        with the council, licence, attribution and source link. nationalRank: the school''s place among England''s state mainstream
        schools (KS2 % at the expected standard in reading, writing and maths, ties broken by % at the higher standard; KS4
        Attainment 8), latest year as the headline with every loaded year in history; equal figures share a rank, top % =
        ceil(rank / total * 100); null when no rank is loaded. profile: GIAS gender, trust and capacity, and the latest census
        and absence shares, each with its academic year and source release (null when not published). inspectionCounts: graded
        areas above / below the bar and "to improve" points of the latest graded inspection. admissions.byYear: every entry
        year with first-choice applications not offered on offer day (100 × (1 − first-preference offers ÷ first preferences))
        and applications and offers by preference. Migration 056, each null when the school has no published figure (missing[]
        says why): parentView (Ofsted Parent View, 10+ submissions only: the survey in use since 10 November 2025, else the
        earlier survey, migration 060, surveyEra says which; never both), workforce (latest school workforce census), finance
        (one CFR or AAR return, the school''s own kind, never both) and destinations (secondaries only: KS4 and 16-18 destination
        measures; null for primaries). Figures are as published, with year and sourceRelease; per-pupil money is the published
        total ÷ FTE pupils of the same return.'
      operationId: getSchoolCard
      parameters:
      - name: urn
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: A school-card.v1 payload
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SchoolCardResponse'}
        '404': {description: School not found}
        '422':
          description: Validation Error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HTTPValidationError'}
