components:
  schemas:
    AddressHistory:
      properties:
        addressId: {type: string, pattern: '^uk:addr:[0-9a-f]{12}$'}
        displayAddress: {type: string}
        postcode: {type: string}
        geographyId: {$ref: '#/components/schemas/GeographyId'}
        saleCount: {type: integer, minimum: 0.0}
        coordinatesPrecision: {type: string, const: postcode}
        transactions:
          items: {$ref: '#/components/schemas/AddressSale'}
          type: array
        estimateDisclaimer: {type: string}
        sourceVersion: {type: string}
      type: object
      required: [addressId, displayAddress, postcode, geographyId, saleCount, coordinatesPrecision, transactions, estimateDisclaimer,
        sourceVersion]
    AddressHistoryResponse:
      properties:
        schemaVersion: {type: string, const: address-history.v1}
        history: {$ref: '#/components/schemas/AddressHistory'}
        sources:
          anyOf:
          - items: {$ref: '#/components/schemas/SourceRelease'}
            type: array
          - {type: 'null'}
          description: Publisher, licence and attribution text of the active sources behind the home (HM Land Registry, OS
            Open UPRN, EPC register); display the attribution with the data
      type: object
      required: [schemaVersion, history]
    AddressSale:
      properties:
        date: {type: string, format: date}
        nominalPrice: {type: integer}
        floorAreaSquareMetres:
          anyOf:
          - {type: number}
          - {type: 'null'}
