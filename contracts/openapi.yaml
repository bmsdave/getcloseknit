      type: object
      required: [schemaVersion, metricId, period, sourceVersion, values]
      description: 'Every area''s value of one metric in one month (area-value-pack.v1): the map''s colours.'
    ValuePackEntry:
      properties:
        geographyId: {$ref: '#/components/schemas/GeographyId'}
        name: {type: string}
        metricId: {$ref: '#/components/schemas/MetricId'}
        period: {type: string}
        value:
          anyOf:
          - {type: number}
          - {type: 'null'}
          description: 'null when suppressed: unavailable, never zero'
        regionPercentile:
          anyOf: &id011
          - {type: integer, maximum: 100.0, minimum: 0.0}
          - {type: 'null'}
          description: Percentile within the area's region (rankScope); London's for a London area
        countryPercentile:
          anyOf: &id012
          - {type: integer, maximum: 100.0, minimum: 0.0}
          - {type: 'null'}
          description: Percentile within England; null with CLOSE_KNIT_ENGLAND off
        direction:
          anyOf:
          - type: string
            enum: [higher-is-more, higher-is-better, neutral]
          - {type: 'null'}
        percentileMeaning:
          anyOf:
          - {type: string}
          - {type: 'null'}
          description: 'What the percentile means: "90 = lower than 10% of London LSOAs"'
        sampleCount:
          anyOf:
          - {type: integer, minimum: 0.0}
          - {type: 'null'}
        breakdown:
          additionalProperties: {type: number}
          type: object
          description: 'Present on crime: offences by type'
          examples:
          - {Shoplifting: 4}
        quality: {$ref: '#/components/schemas/Quality'}
        sourceVersion: {type: string}
        carrier: {$ref: '#/components/schemas/Carrier', description: 'The level the value comes from: a fallback''s wider
            area, else the area itself'}
        carrierGeographyId:
          anyOf:
          - {$ref: '#/components/schemas/GeographyId'}
          - {type: 'null'}
          description: 'A fallback''s real home (#206): the wider area the value comes from'
        carrierName:
          anyOf:
          - {type: string}
          - {type: 'null'}
          description: The carrier area's shown name; null when unknown
        carrierSampleCount:
          anyOf:
          - {type: integer}
          - {type: 'null'}
        areaCount:
          anyOf:
          - {type: integer}
          - {type: 'null'}
          description: 'An on-the-fly median of LSOA values (#208): how many areas it used'
        londonPercentile:
          anyOf: *id011
          deprecated: true
          description: Deprecated alias of regionPercentile (same value), removed in the next contract version
        englandPercentile:
          anyOf: *id012
          deprecated: true
          description: Deprecated alias of countryPercentile (same value), removed in the next contract version
      type: object
      required: [geographyId, name, metricId, period, value, regionPercentile, countryPercentile, sampleCount, quality, sourceVersion,
        carrier]
    WhereCriterion:
      properties:
        kind: {type: string, const: where}
        zones:
          items:
            anyOf:
            - {$ref: '#/components/schemas/StationZone'}
            - {$ref: '#/components/schemas/BoroughZone'}
            - {$ref: '#/components/schemas/LsoasZone'}
            - {$ref: '#/components/schemas/PolygonZone'}
          type: array
          maxItems: 3
          minItems: 1
        softMetres:
          anyOf:
          - {type: integer, maximum: 5000.0, minimum: 100.0}
          - {type: 'null'}
          default: 1000
        must:
          anyOf:
          - {type: boolean}
          - {type: 'null'}
          default: false
      type: object
      required: [kind, zones]
      description: 'Where: fit 1 inside any zone, falling linearly to 0 at softMetres outside (distance from the area''s

        point to the nearest area inside); must = only inside (unmet limit zone:outside).'
    ZoneShape:
      properties:
        kind:
          type: string
          enum: [station, borough, lsoas, polygon]
        geometry:
          anyOf:
          - {additionalProperties: true, type: object}
          - {type: 'null'}
          description: GeoJSON Polygon or MultiPolygon
      type: object
      required: [kind, geometry]
    ZoneShapesRequest:
      properties:
        zones:
          items: {additionalProperties: true, type: object}
          type: array
          maxItems: 3
          minItems: 1
          description: As PreferenceProfile.zones
      type: object
      required: [zones]
    ZoneShapesResponse:
      properties:
        schemaVersion: {type: string, const: zone-shapes.v1}
        zones:
          items: {$ref: '#/components/schemas/ZoneShape'}
          type: array
      type: object
      required: [schemaVersion, zones]
