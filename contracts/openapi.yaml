        2024/25; Progress 8 is the 2023/24 figure with its own cohort), drop suppressed figures and cohorts under 30. legacy-outstanding
        lists legacy Outstanding schools not since inspected under report cards, newest inspection first. report-card-exceptional
        counts the report-card areas graded exceptional. Report-card and legacy grades are never combined.
