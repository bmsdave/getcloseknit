notes: >-
  Register is one 1855-page PDF of HMO licences only (mandatory about 1724, additional about 1911 records; extract dated
  30/09/2026); a separate PDF lists selective licences (file 11457), not needed. Each licence starts with a reference like
  21/02367/HOHMOL, then the property address in a narrow column; the postcode is the first one in the record but
  about 6% wrap onto the next line, even splitting the outward and inward parts ("E15" / "1GW"), so join lines first. The page
  says the online register is offline and to contact the office, yet the PDFs download fine. Both schemes exclude Royal
  Victoria and Stratford Olympic Park wards.
