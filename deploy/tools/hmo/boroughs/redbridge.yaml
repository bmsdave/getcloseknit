notes: >-
  The register page has a postcode/address search, but its "Export Register" button returns the whole register as CSV
  (about 10,900 rows; columns Licence Holder, Issued, Licence Starts, Licence Expiry, Address Line 1, Town, Postcode,
  Max Occupants). It is an ASP.NET form POST (needs the page's hidden __VIEWSTATE fields plus button
  ctl00$ctl00$PageContent$PageContent$btnExportRegister), not a file URL, so left as search-only. The CSV has no licence-type
  column and mixes HMO and selective licences, so it cannot be filtered to HMOs. Postcode column is filled in about 99.6% of rows. Page also warns of technical issues.
