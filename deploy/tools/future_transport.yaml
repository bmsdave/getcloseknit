# New stations in Greater London, read by deploy/tools/etl_future_transport.py (migration 088).
#
# Curated by hand on 2026-10-18. Each scheme cites the official page its status comes from: TfL
# (tfl.gov.uk and its subdomains), the GLA (london.gov.uk) or DfT (gov.uk, and hs2.org.uk for HS2 Ltd,
# DfT's delivery body). Statuses:
#   under construction  works on site
#   consented           legal powers granted (Act of Parliament, TWAO, DCO), not yet building
#   funded              money committed, no powers yet
#   proposed            plans, consultation or safeguarding only; never shown as coming
# expected_year: only a year the official page publishes, else null.
# Points (WGS84) are placed from the official page's description or map, to about 200 m; `placed` says how.
# Existing stations that gain new platforms (New Cross Gate, Lewisham) are left out: they are not new.
# Re-check every status against its page before each load.

schemes:
