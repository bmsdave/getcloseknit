[project]
name = "close-knit-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.35.0",
    "psycopg[binary]==3.2.9",
    "psycopg-pool==3.2.6",
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "coverage>=7.6", "pyyaml>=6"]
# deploy/tools ETLs and their tests (deploy/tests) run in the API venv: pip install -e "api[tools]".
tools = ["numpy>=2,<3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["area_api*"]

[tool.setuptools.package-data]
area_api = ["fixtures/*.json", "widgets/*.html"]
