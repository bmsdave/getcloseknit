  modesVals() {
    const mode = (this.state && this.state.mode) || '2d';
    return [['2d', '2D'], ['3d', '3D']].map((m) => ({
      label: m[1], on: mode === m[0],
      bg: mode === m[0] ? '#ffffff' : 'transparent',
      fg: mode === m[0] ? '#22252c' : '#5b6270',
      sh: mode === m[0] ? '0 1px 2px rgba(20, 30, 50, 0.12)' : 'none',
      pick: () => this.setState({ mode: m[0] })
    }));
  }

    const cur = (this.state && this.state.theme) || 'auto';

      label: t[1], on: cur === t[0],
      bg: cur === t[0] ? '#ffffff' : 'transparent',
      fg: cur === t[0] ? '#22252c' : '#5b6270',
      sh: cur === t[0] ? '0 1px 2px rgba(20, 30, 50, 0.12)' : 'none',
      pick: () => this.setState({ theme: t[0] })
    }));
  }


  footVals(key, dark) {
    const s = (this.state || {})[key] || {};
    const set = (o) => this.setState({ [key]: Object.assign({}, s, o) });
    const pals = [
      ['current', 'Standard (traffic light)', ['#8fbbe3', '#f6c445', '#f28b30', '#e2453c']],
      ['colour-blind', 'Colour-blind safe', ['#dbe6f2', '#8fbbe3', '#4a7fc4', '#2f5bd3']],
      ['viridis', 'Viridis', ['#440154', '#2a788e', '#22a884', '#fde725']],
      ['magma', 'Magma', ['#fcfdbf', '#f1605d', '#b73779', '#2c115f']],
      ['yarn', 'Yarn (brand)', ['#2f5bd3', '#f6c445', '#f28b30', '#e2453c']],
      ['ocean', 'Ocean', ['#eff6fb', '#9ecae1', '#3182bd', '#08519c']],
      ['ember', 'Ember', ['#ffffcc', '#feb24c', '#e31a1c', '#800026']]
    ];
    const cur = s.pal || 'current';
    const open = !!s.colOpen;
    const sw = (l) => l.map((c) => ({ c: c }));
    return {
      colOpen: open, chev: open ? 'rotate(90deg)' : 'none', flipCol: () => set({ colOpen: !open }),
      curSw: sw((pals.find((p) => p[0] === cur) || pals[0])[2]),
      cols: pals.map((p) => ({
        label: p[1], on: p[0] === cur, fw: p[0] === cur ? 800 : 600, fg: dark ? '#eef1f5' : '#22252c',
        bg: p[0] === cur ? (dark ? '#2c313a' : '#eef2f7') : 'transparent', sw: sw(p[2]), pick: () => set({ pal: p[0] })
      }))
    };
  }

  renderVals() {
    const nav = [
      { id: 'place', label: 'Find a place', links: ['My match', 'Rankings', 'Boroughs'] },
      { id: 'tools', label: 'Tools', links: ['Check a home', 'Stamp duty', 'Mortgage', 'Investor'] },
      { id: 'learn', label: 'Learn', links: ['Guide', 'AI agents', 'About'] }
    ];
    return {
      nd: (this.state || {}).notes === false ? 'none' : 'inline-flex', notesLabel: (this.state || {}).notes === false ? 'Notes off' : 'Notes on', flipNotes: () => this.setState({ notes: (this.state || {}).notes === false }),
      themes: this.themesVals(),
      foot: this.footVals('foot', false),
      modes: this.modesVals(),
      groups: nav.map((g) => ({
        label: g.label, open: g.id === 'place', closed: g.id !== 'place',
        links: g.links.map((label) => ({ label: label, current: label === 'Map', other: label !== 'Map' }))
      }))
    };
  }
}
</script>
</body>
</html>
