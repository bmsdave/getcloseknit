notes: 'Best-covered LA. Live cumulative compendia "Applications and Offers at Hackney Primary/Secondary
  Schools 2018-26" (31 and 34 pages) cover every year 2018-2026 for both phases and are the simplest single
  source. Each year''s section is a "How places were offered" table. Primary: per school, places, total
  applications, offers by criterion, "Max Distance (last child offered in miles)"; 2018-2020 pages print
  the distance in brackets, e.g. "47 (0.486)". Secondary: per school and ability band, offers by criterion
  and "Maximum Distance (miles)". Standalone per-year files are also archived: Reception 2022 (CDX 20250410211240),
  2023-2025; Secondary Transfer 2022-2026. Measurement method is not stated in the files. hackney.gov.uk
  (the council site) says its data is free to re-use under the Open Government Licence, but education.hackney.gov.uk
  carries only the copyright and free-download statement quoted.'
