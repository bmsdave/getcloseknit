notes: 'Admissions run by Achieving for Children (shared with Richmond 318): pages under https://kr.afcinfo.org.uk/pages/community-information/information-and-advice/school-admissions/
  (starting-school... and apply-for-a-secondary-school-place-in-september) list BOTH Kingston and Richmond
  docs on shared AfC CDNs (hubb-production digitaloceanspaces and rackcdn 5f2fe325...). Rolling 3-year
  docs; one doc per year assigned to the newest live doc covering it. Primary: community schools only
  (academies/faith publish own); gives distance of last child at offer date AND furthest offered from
  waiting list at end of national coordination (31 Aug). Primary 2024-2026 file name says "2026-2023"
  but contains 2024-2026 only. Secondary: "Cut off distance at NOD" + "distance at end of NC" per year;
  no criterion counts; academies "contact the school"; straight-line only implied (Google Maps straight-line
  advice) in 2024-2026 doc. Secondary 2019/2020 not found (file/1020 slug "2021-2019" actually holds 2021-2023).
  Other archived variants: rackcdn 14102/14108 (2021-23), 16708 (prim 2022-24, now 404), RBK_Notes_to_parents_following_secondary_2026_allocation.pdf
  (rackcdn 19213, Wayback 20260611104622, now 404), RBK_Notes_to_parents_following_Secondary_2023_allocation_v3.docx.pdf
  (live, 1 Mar 2023 furthest distances). Wayback: Schools_Allocation_List_2023.xlsx (rackcdn 12757) unchecked.'
