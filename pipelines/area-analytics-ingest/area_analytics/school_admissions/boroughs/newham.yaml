notes: 'All on newham.gov.uk/downloads/file/<id>/<slug> (live 200; index page https://www.newham.gov.uk/Schooladmissionstats).
  Per school: admission number, on-time applications, offers per criterion, total, ''criterion of final
  offer'' and ''distance of final offer (miles)'' plus tie-break column (''Shortest Walking Distance in
  Miles''; some academies e.g. Harris Chobham say ''Straight Line Distance''). Includes all schools incl.
  academies/faith. Secondary 2026 (files 11080 and 11387, 2 Mar 2026) has only application/preference
  counts, no distance table, so it is not listed. Reception 2022 original file 4517 now 404; 9036 is the
  re-upload. 2019 secondary also has on-time+late file 302.'
