notes: 'enfield.gov.uk returns 403 to curl and WebFetch, so everything here is Wayback. Search results
  show a live ''Reception-previous-allocation-breakdown-Education.pdf'' (__data/assets/pdf_file/0011/103043/)
  covering Sept 2022-2025. It returns 403 and is not in the CDX, so it is not recorded. Secondary allocation-information
  sheets also exist: 2020 (0013/5800), 2021 (0028/18694), 2023 (0023/33773) and 2024 (0018/53721) are
  text PDFs; 2022 (0022/20389) is scanned. Primary allocation sheets for 2020-2023 (18690, 18691, 20388,
  35110) are scanned PDFs. Missing: primary 2026, secondary 2025-2026. Primary priority zones exist, but
  no map URL was found. Adapter notes: ''Cuckoo Hall Academy'' (2019, 2020) merged into Woodpecker Hall
  Primary Academy 136952 in 2021 (GIAS); its rows are kept under 136952 as site ''Cuckoo Hall'' (config
  sites) so they do not overwrite Woodpecker Hall''s own. Broomfield School is Laurel Park School 102056
  (same URN, renamed). ''Carterhatch'' in the reception table is Carterhatch Infant School. Schools in
  the ''It has been possible to meet the demand ...'' paragraph are all offered. Secondary prose rows
  (Enfield County quota, Latymer test rank, St Anne''s and St Ignatius faith criteria with a distance)
  are not read.'
