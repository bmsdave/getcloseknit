notes: 'No catchment areas. After the 2023-24 booklets Bexley moved its school lists to HTML pages (admission-primary-schools-25-26/primary-schools-bexley,
  admission-secondary-schools-26-27/secondary-schools-bexley). These show only PAN and preference counts,
  with no distances. The live site returns 403 to non-browser clients. Missing: primary 2023-2026, secondary
  2023-2026 and secondary offer-day figures. The archived 2021-22 primary and 2021 secondary booklets
  are cut off at 1 MB. Adapter notes: primary only; ''See note'' cells (faith schools) are not read; ''All
  on time offered'' is kept as all offered with no raw value; ''(TB)'' marks a tie-break distance. Secondary
  2019-2022 are not read (see the secondary 2019 note). ''Haberdashers'' Aske''s Crayford Temple Grove''
  (2019) is aliased to Haberdashers'' Crayford Primary 147358 (and ''... Slade Green Temple Grove'' to
  Haberdashers'' Slade Green Primary 147356): GIAS records both as split from Haberdashers'' Crayford
  Academy on 1 Sep 2019, the start of that intake. The 2022-23 and 2023-24 booklets agree on the shared
  2020 and 2021 columns (36/36 and 35/36 schools; the other differs only by its ''(TB)'' mark).'
