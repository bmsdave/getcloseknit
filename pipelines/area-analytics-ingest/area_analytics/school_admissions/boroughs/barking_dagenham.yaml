notes: 'All data is in the annual e-booklets'' ''Statistical information'' table: the previous round''s
  applications, admission number, EHCP/LAC/sibling/distance counts, ''Last place'' (km, as the crow flies)
  and appeals. Community schools have full data; for VA schools the booklet says to contact the school.
  Not found: primary 2023 (the ''Starting School 2024'' booklet is not listed) and primary 2026 (2027
  booklet not yet out); secondary 2019-2021 (the 2023 booklet is the oldest listed). The 2024-11 SS2025
  file also exists without ''HG'' in its name (024375%20LBBD%20SS%202025%20ebooklet%20FINAL.pdf, live
  200). Adapter notes: ''Marks Gate'' (2019 entry) is aliased to Rose Lane Primary 101224, the GIAS successor
  (merged 1 Sep 2019) of Marks Gate Infants'' 101210. ''Manor - Longbridge'' and ''Manor - Sandringham''
  are sites of Manor Primary 101193 (site column). Only decimal last-place cells are distances; ''-'',
  ''N/A'' and a bare ''0'' are not explained by the booklet and are kept as no distance. VA schools print
  ''Criteria do not apply''. The primary 2025 table heading reads ''2024 Criteria'' but the text names
  September 2025; it differs from the 2024 table. Secondary 2026: the 2026-08 and 2026-10 booklets print
  the same table (read once).'
