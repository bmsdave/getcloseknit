notes: 'rbkc.gov.uk answers 403 to scripted downloads (2026-10-11), so the brochures are read from their
  Wayback captures; the 2027 primary brochure and the 2 March 2026 bi-borough file are not archived (missing).
  Each annual primary or secondary admissions brochure has a per-school "How places were offered
  in <previous year>" box: on-time applications, offers by criterion, and "up to a distance of X of a
  mile straight-line", or "All on-time applicants were offered". RBKC brochures cover RBKC schools only.
  The standalone "How places were offered at bi-borough secondary schools" PDFs (2023 file, created 2023-02-28;
  2026 file dated 2 March 2026) also cover Westminster secondaries, with per-band distances. The 2027
  secondary brochure (sites/default/files/media/documents/secondary-admissions-brochure-2027_0.pdf) duplicates
  2026 for the six RBKC schools. All URLs are live. Gaps: 2019-2021 for both phases; the pre-2022 brochures
  were not found on the current site or in Wayback (the old /pdf/ and atoms/files paths hold only older
  or unrelated files).'
