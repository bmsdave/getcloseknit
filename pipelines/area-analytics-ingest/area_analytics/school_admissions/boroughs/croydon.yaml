notes: 'Search results list stand-alone secondary overviews for 2024 (new.croydon.gov.uk/.../2024-03/overview-of-secondary-allocations-B-03-24.pdf)
  and 2025 (.../2025-04/overview-of-secondary-school-allocations-2025.pdf). Both return 404 live and are
  not in the CDX, so they are not recorded. Missing: secondary 2019, 2020 and 2026. The archived 2019-20,
  2020-21 and 2021-22 secondary prospectuses and the 2020-21 primary prospectus are all cut off at 1 MB.
  Distances are measured on the council GIS (''direct line measurement''). Adapter notes: ''columns''
  gives the printed year order of a primary prospectus overview (its diagonal headers are unreadable as
  text); the order was read from the header characters'' positions and checked against the 2020/2022 XLSX
  (32/32 and 28/33 schools equal) and the 2024/2025 booklets'' shared 2023 column (72/72 equal). Secondary
  prospectus overviews (2021, 2024, 2025) are not read; the stand-alone 2022 and 2023 overviews are. Trust
  suffixes (''- The STEP Academy Trust'', ''- Pegasus Academy Trust'') are dropped from names.'
