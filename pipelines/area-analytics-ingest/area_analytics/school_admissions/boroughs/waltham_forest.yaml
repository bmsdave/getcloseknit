notes: 'Reception: one standalone ''How school places were offered'' PDF per year covering all schools.
  Columns: PAN, offers per criterion (SEN/EHC, LAC, medical, social, sibling, staff, religious, catchment,
  distance, LA alternative), places available, cut-off distance. The 2019-2021 headers do not state units;
  values are consistent with miles, and from 2026 the header says ''In Miles''. 2024 also has a revised
  version at 2024-09/How%20School%20Places%20Were%20Offered%20for%20reception%202024.pdf. Secondary: standalone
  PDFs only for 2022 and 2026; 2023-2025 come from the next year''s ''Starting Secondary School'' brochure
  (''How places were allocated on 1 March 2023/2024'', ''3 March 2025'' table plus a 3-year cut-off table).
  2020-2021 come only from the cut-off-distance table in the 2023 brochure (columns 2020/21, 2021/22,
  2022/23 = entry year). Secondary 2019 not recovered: the WB copies of the 2021 and 2022 brochures are
  truncated at 1MB. Primary brochures (e.g. 2024-09/Starting%20Primary%20School%202025.pdf) also carry
  a 3-year cut-off table. Straight-line distance in miles is stated in the 2026 secondary brochure''s
  admissions criteria. Some schools have catchment/feeder criteria (e.g. Chingford Foundation catchment,
  Eden Girls School/Station split); no maps recorded.'
