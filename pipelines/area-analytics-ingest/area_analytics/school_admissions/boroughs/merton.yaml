notes: 'One rolling PDF (33pp, updated 1 Sep 2026; landing page https://www.merton.gov.uk/education-and-learning/schools/admissions/recent-years)
  covers 2021-2026 both phases: furthest distance (m) at offer day, second round and 1 Sept. Only LA-run
  schools have distances; academies/church schools say ''contact school''. 2019/2020 (and 2016-2018) from
  the old HTML page in Wayback (snapshots 2019-09..2023-03). Distance is straight line for community primaries
  (2025-26 arrangements); Dundonald/Wimbledon Chase/Wimbledon Park use admissions priority areas (APA)
  and report distance inside/outside the APA. Secondary method not checked (only Raynes Park/Ricards Lodge/Rutlish
  reported). Older version: WB 20260118074335 .../2025-04/...table%20April%2025.pdf.'
