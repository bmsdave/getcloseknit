notes: 'There is also a multi-year ''previous years'' admissions'' summary for 2022-2025 with appeals.
  Primary: https://www.wandsworth.gov.uk/media/ij5oxjfs/previous_years_admissions_for_wandsworth_primary_schools.pdf.
  Secondary: https://www.wandsworth.gov.uk/media/yi1hafdr/previous_years_admissions_for_wandsworth_secondary_schools.pdf.
  Its distances are at the end of August, not on offer day. Not found: primary 2019 and 2021, secondary
  2019 and 2020. Some schools have priority areas (described in admission policies); no map was found.
  Adapter notes: closed schools with no successor (Broadwater 2023, Christ Church CE 2024, St Anne''s
  CE 2025, Goldfinch 2025) are accepted unmatched. Primary tables whose last column is not a distance
  (faith criteria only) give no row; Belleville Wix prints a row per class (rules bilingual / english).
  Secondary: bands (Ashcroft, Chestnut Grove) and Bolingbroke feeder schools are rules; the distance tie-break
  inside a selective score (Burntwood, Graveney, Ernest Bevin) is not read; Chestnut Grove 2023 band E
  prints its distance under siblings, not distance, and is not read.'
