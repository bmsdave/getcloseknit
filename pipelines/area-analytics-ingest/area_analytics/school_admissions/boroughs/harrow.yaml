notes: 'Every PDF header states the offer date (e.g. "for September 2026 on 2 March 2026"; primary "on
  16th April 2026"), i.e. national offer day. Filenames are misleading: file 31344 "22_23" is actually
  Sept 2023 entry (verified); duplicates exist (32261 = 2023, 32116 = 2024, 32970 = 2025, 30858 = 2022
  primary, archived). 2019-2022 docs are no longer live (404) - Wayback only. Straight-line stated in
  2019 secondary and 2026 docs. Live listing pages: /schools-learning/apply-secondary-school-place/4 and
  /schools-learning/apply-primary-school-place/4. Count columns vary by year (Hindu/ISKCON faith columns
  in later years).'
