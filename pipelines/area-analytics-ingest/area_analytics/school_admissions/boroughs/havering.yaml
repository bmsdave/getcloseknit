notes: 'Listing pages: https://www.havering.gov.uk/downloads/download/396/infant-and-primary-school-statistics
  and https://www.havering.gov.uk/downloads/download/398/secondary-school-statistics (2012-2026). Column
  "Furthest Distance Taken at Initial Allocation in KM''s (Straight line distance)"; header "Initial Allocations
  as of 16 April <year>" = NOD. Wide landscape tables; pdftotext -layout splits columns across very long
  lines. Count lists sampled from 2019 and 2026 only; middle years assumed. "Preferences expressed" is
  all preferences 1-6, not first-preference applicants. Some schools use "Priority Area" criteria (no
  map found). Secondary footnote: Coopers'' distance is furthest Havering resident excluding random allocation.'
