notes: 'Westminster has no standalone tables: data is a per-school text box in the annual brochure (previous
  year''s offers by criterion, cut-off in miles straight-line). Bi-borough secondary ''how places were
  offered'' PDFs are on rbkc.gov.uk for 2023-2026. The 2020 primary brochure (287_1_-_wcc_primary_school_brochure_2020_006.pdf,
  CDX 20201201085646) is cut off at 1 MB in the archive, so its data year (2019 or 2020) is unknown. Not
  found: secondary 2019 and 2020, primary 2019 and 2020. Brochure years marked ''inferred'' assume the
  publication pattern of the verified ones: brochure ''YYYY'' covers the YYYY-1 round from 2023 onward,
  and the 2021 bi-borough brochure covers 2021. Adapter notes: George Eliot + Robinsfield (now St John''s
  Wood Primary 101107), Churchill Gardens + Millbank (now Millbank Gardens 151310) and Our Lady of Dolours
  (merged into St Mary of the Angels 101137) keep their pre-merger rows as sites (config sites). The 2021
  bi-borough brochure is printed as spreads: boxes are attributed to the wrong school (Pimlico twice),
  so 2021 is not loaded. Secondary brochures: a school''s name is on the page before its box and several
  pages break that pattern (''Performing Arts'', ''Visiting The School'', ''Harris Academy'' cut short),
  so no secondary year is loaded. Barrow Hill Junior School is not in the GIAS London extract. Primary
  2022 and 2024 copies are cut off at 1 MB; primary 2025 is 404.'
