notes: 'Data comes only from the annual booklets, as a 3-year rolling ''Distances and appeals'' table.
  Jadu reuses each file id (28, 1863) and changes the slug, so a snapshot''s slug year does not match
  its content. Several other snapshots are cut off at 1 MB. No catchment areas. ''N/A'' means all applicants
  offered. Missing: 2019-2020, both phases. Adapter notes: only the configured year column of the 3-year
  table is read. N/A is all offered only where the booklet prints its legend (every primary booklet and
  the 2023-24 secondary booklet read for 2021 and 2022); the 2026-27 and 2027-28 secondary booklets have
  none, so its N/A rows are left out. Grammar test-score and banded schools (band tables) are not read.
  Juniors are Year 3 entry.'
