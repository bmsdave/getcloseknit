  (2023-2026 only); no live primary listing found, 2026 primary file found by search. Each doc also carries
  the previous year''s column (primary 2021 doc gives 2020; 2019 secondary gives 2018; 2026 primary gives
  2025). Primary distance EXCLUDES sibling criterion; "N/A (U)" = undersubscribed, "N/A (F)" = faith.
  Primary 2019 not found. 2026 primary header says "Kilometres" but values (e.g. 3134, 1376) are metres
  - header error. 2024-2026 secondary PDFs are image-only (Word/Excel export, no text layer; OCR needed);
  checked 2026 visually: metres. Alternate 2024 primary capture: .../media/13876/.../pdf/1lSeptember-2024-allocation-data.pdf
