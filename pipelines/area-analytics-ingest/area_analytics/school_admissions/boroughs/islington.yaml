notes: 'The cut-off-distance page is a rolling three-year HTML table (primary and secondary, miles; secondary
  by band), with year columns labelled by academic year ("2024-25" = 2024 entry). The live page shows
  2024-25 to 2026-27; the Wayback snapshot 20241012230224 shows 2022-23 to 2024-25. Earliest snapshot
  is Oct 2024. Older years come from the admissions booklets: the 2020/21 primary booklet (live) has a
  table of applications, offers by criterion and "Cut off Distance (miles)" for Sept 2019, and says distance
  is straight line. The brochures for 2022 admissions (live) give per-school text "Last pupil admitted
  under distance criterion in Sept 2021". Gaps: primary 2020; secondary 2019-2020 (the 2021-admission
  brochures and a 2020/21 secondary booklet were not found). Per-school cut-off-distance map PDFs existed
  for 2019/20 (Canonbury, Elizabeth Garrett Anderson are archived). No copyright or licence statement
  found on islington.gov.uk (footer has none; no copyright page).'
