notes: 'Rolling 3-year PDFs on richmond.gov.uk. Old numeric URLs (/media/17682/, /media/25749/) redirect
  to the live ones. Primary covers only community infant/primary/junior schools: offers per criterion,
  distance of last child at offer date, furthest distance from waiting list at end of national coordination,
  appeals. Secondary covers all borough secondaries: NOD cut-off and end-of-coordination (31 Aug) distance,
  sometimes with criterion (e.g. ''Crit 10 - 4.547 kms''). Method: shortest route by road and/or maintained
  footpath (GIS), per 2024-25 determined arrangements. No 2024-2026 editions found: admissions moved to
  AfC (kr.afcinfo.org.uk) and neither its admissions pages nor the 2026 schools brochure (rackcdn attachment
  18825) has cut-off tables. Kingston is covered by another agent. Also available: notes_to_parents_following_*_allocation
  PDFs 2021-2023 (not checked for distances).'
