notes: 'Listing pages: https://www.hounslow.gov.uk/primary-school-admissions/allocation-reception-primary-school-places
  and https://www.hounslow.gov.uk/secondary-school-admissions/allocation-year-7-secondary-school-places.
  Docs don''t state the snapshot date (assumed allocation/NOD) nor measurement method. Distance cell is
  text "57 - all offered" / "34 - last distance - 0.376 miles" (count + distance in one cell). "Applications"
  = all preferences regardless of order. Secondary is per-school text blocks (criteria -> allocations),
  not a grid. Duplicates: 11494 (primary 2025 alt), 13618 (primary 2026 alt "Reception places September
  2026"). Primary 2019-2022 not found: id/3164 "how primary school places were allocated april 2021" and
  id/2678 "last distance offered" appear in search but 404 and absent from Wayback. Secondary 2019 not
  found; 3522 is a 3-year table (2020/2021/2022) without counts. Licence is restrictive (private non-commercial
  use only).'
