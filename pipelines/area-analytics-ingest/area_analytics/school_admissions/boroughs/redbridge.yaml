notes: 'Per-school prose lists (no counts): last-offered distance per criterion band (sibling/distance/faith
  points/catchment), ''All On Time Applicants Offered'' where undersubscribed; primary sheets cover community,
  academy and faith schools. Secondary is mostly miles, but some schools are quoted in metres where they
  use their own measurement. Method: 2027-28 arrangements say ''shortest measured walking distance'' by
  GIS. Site migration made old numeric /media/<n>/ URLs 404; only the 2025 primary and 2026 docs are live.
  Missing: 2019, 2020 both phases; secondary 2022 (search-indexed /media/9957/transfer-to-sec-2022-...-002-003.pdf,
  live 404, not in Wayback). WB 7156/primary-school-2020_v6_web.pdf (brochure) archived truncated at 1MB.
  Scanned: rec 2024, sec 2021, sec 2025 (WB 20250930 wqnlilt2/secondary-school-allocation-2025.pdf, also
  scanned). Secondary admissions page links https://my.redbridge.gov.uk/map (catchment lookup not verified).'
