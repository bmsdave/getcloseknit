notes: 'Index page: https://www.brent.gov.uk/education-schools-and-learning/school-admissions/how-school-places-were-offered
  (it links 2025 and 2026 files, which carry ?rev=&hash= query strings that are not needed). There is
  a 2018 series in Wayback (/media/16410390, /16410393). The Wayback CDX for brent.gov.uk/media has almost
  nothing after early 2022, so primary 2020-2023 and secondary 2021-2023 were not found. Brent says to
  email school.admissions@brent.gov.uk for earlier years. The 2019 community table has ''catchment area''
  criteria, but no map was found. Adapter notes: every criterion printed with a furthest distance is a
  rule (criteria are not always in priority order); an undersubscribed school is one all-offered row;
  999999 is a placeholder and is not read; the 2019 community matrix is read with pdfplumber. Leopold
  and other split sites are kept as sites. Capital City Academy is Harris Lowe Academy Willesden 134226
  (same URN/postcode); The Crest Academy is E-ACT Crest Academy 135973; Malorees Infant is Malorees Primary
  101507 (renamed after the 2026 merger). Distances over 10 miles are accepted as printed (see accept_note).'
