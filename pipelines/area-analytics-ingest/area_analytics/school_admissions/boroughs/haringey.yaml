notes: 'Also HTML multi-year tables (miles, NOD, 2022-2026, N/A = all applicants offered) at https://haringey.gov.uk/schools-learning/schools/school-admissions/how-school-place-offers-were-made/cutoff-distance-school-last-child-offered-place/primary-schools-distance-school-last-child-offered-place-national-offer-day
  and .../secondary-schools-distance-school-last-child-offered-place-national-offer-day; a separate "1
  September" page exists. PDF columns sampled on 2026 reception (offers as at 16 Apr 2026) and 2019 secondary
  (states straight-line). Secondary 2019 PDF also has offers-by-preference tables. Cut-off distance maps
  also for 2024/2025 (2024-06 and 2025-03 folders). Faith/banded schools "contact school". Licence: no
  copyright/OGL statement found; about-this-website lists "Legal notices" but link points to data-protection
  page. Adapter notes: ''Seven Sisters Primary'' is South Grove Primary 132253 (GIAS: the amalgamation
  of Seven Sisters Infant and Junior, N15 5QE; it appears as South Grove from 2026). St Francis de Sales
  RC Infant is the academy 151947 (GIAS successor). Schools listed after the table as offering every on-time
  applicant (or as having vacancies on offer day) are loaded as all offered, the sentence kept in last_offer_criterion.
  Tiverton (closed 2025), Stamford Hill (merged into Tiverton 2020) and St Peter-in-Chains RC Infant (closed
  2025) have no current school and are accepted unmatched. Prose cells (''Last child offered under Faith
  - 1.1872 miles'') are not read.'
