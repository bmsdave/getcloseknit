notes: 'barnet.gov.uk sits behind a bot wall (''Pardon Our Interruption''), so everything here is Wayback.
  The CDX lists how_primary_school_places_were_allocated_on_16_april_2026.pdf as 200, but both captures
  are the bot-challenge HTML, so it is not recorded. Missing: primary 2020, 2022 and 2026, plus community
  schools for 2023-2024; secondary 2026. Archived Guide to Primary booklets for 2021, 2023 and 2024 are
  cut off at 1 MB (unreadable). Community primary schools give priority to a ''defined area''. Secondary
  schools have N2/N3 priority postcodes. No map URL was found. Adapter notes: the 2021 secondary PDF prints
  ''Archer Academy (The)'' a second time over two other rows; the garbled ''AHracshmero nAecaand eHmigyh
  ( TShceh)ool for Girls'' is Hasmonean High School for Girls (75 places) and is aliased. ''Menorah Primary
  Jewish'' before 2024 is URN 101341 (now Menorah Primary School for Girls; the boys'' school 150274 opened
  January 2024). Community primary ''All''/''None'' cells are kept as all offered / none offered with
  the cell in the criterion text; secondary ''(All)'' as all offered under that criterion. In the 2023-2025
  secondary file a name cell that crosses a page break picks up the previous school''s last line (''Boys''''
  Queen Elizabeth''''s Girls'''''', ''Catholic Totteridge Academy (The)''); both printed forms are aliased.
  The 2019 primary booklet''s tables are read from pdftotext columns.'
