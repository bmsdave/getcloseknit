notes: 'Best source: the "admission data and statistics" xlsx files (per school: PAN, applications by
  preference 1-6, offers by preference, criterion of the last place offered, "Last distance offered in
  metres, using a straight line"); file "2022_to_2023" = NOD 2022, and so on. The secondary xlsx has a
  second sheet, "Offers by Band". The JSON behind the offers map is machine-readable (school, easting/northing,
  "Last distance offered (m)", "year": "2026"); "html" is used as the nearest format code. A Wayback copy
  of the primary JSON (.js, 20250825220056) holds year 2024. The JSON is the only 2026 source, and the
  map page does not state a year. Booklets duplicate the figures: primary 2023/24 booklet (download/downloads/id/5917,
  entry 2022) and 2024/25 (media/2545, entry 2023) give "Distance of last offer (m)"; secondary 2024/25
  (media/2546, entry 2023) and 2026/27 (entry 2025) give "Last offer on distance (km)" per band. Gaps:
  primary 2019-2021 and 2025; secondary 2019-2021. The 2025/26 booklets (download/downloads/id/7546, 7547,
  CDX 2025-04) were not opened. Old xlsx download URLs now 404 live (Wayback only). James Wolfe distances
  are measured to Meridian House.'
