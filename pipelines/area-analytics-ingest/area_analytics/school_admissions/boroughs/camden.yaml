notes: 'No standalone offer-day report; distances are only in the annual admissions guides, each holding
  the two previous offer rounds (primary "Results and statistics ... on offer date": admission number,
  applications, offers to EHCP/siblings/social-medical, "Furthest child offered on the offer date in miles";
  secondary "Allocation of places": cut-off distance per school/band, n/a = vacancies). Verified by text
  extraction: primary 2019 guide (2017-18; school-hosted copy https://www.primrosehill.camden.sch.uk/wp-content/uploads/2018/11/Starting-School-in-Camden-2019.pdf),
  2026 guide (2024-25); secondary 2021-entry guide (2019-20), 2024 guide (2022-23), 2025 guide (2023-24).
  Other guides'' years inferred from the same two-year pattern. camden.gov.uk returns 403 to scripted
  clients (curl and WebFetch), so everything is via Wayback; the licence page could not be read (null).
  Gaps: primary 2026 (needs the 2027 guide, not seen); secondary 2025-2026 (the 2026 guide snapshot 20250905182633
  is truncated at 5 MB of 8.6 MB; the 2027 brochure camden.gov.uk/documents/d/guest/camden-secondary-admissions-brochure-2027
  shows up in search, said to cover 2025 and 2026, but it returns 403 and is not archived). The 2020 secondary
  guide (documents/20142/876898/Secondary+schools+in+Camden+2020+-+admissions+guide.pdf, CDX 20190922105711)
  should cover 2018-2019 but was not opened.'
