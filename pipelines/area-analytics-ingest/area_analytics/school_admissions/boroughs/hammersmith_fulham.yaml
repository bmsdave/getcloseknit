notes: 'Secondary: standalone "How places were offered for LBHF secondary schools for <year>" PDFs (per
  school: places, applications, offers per criterion/band and "last offer up to X miles straight-line");
  for 2020-2021 the same boxes are in the "Moving on up" brochure of the following year (verified: 2021
  brochure = "How places were offered in 2020"; the 2026 brochure repeats 2025). Primary: per-school "How
  places were offered in <previous year>" boxes in the "Starting school" brochure (siblings/staff/distance
  offer counts, "last distance offered up to X of a mile"); verified 2022 brochure = 2021, 2025 brochure
  = 2024; others inferred from the pattern. lbhf.gov.uk now returns 404 for every old file and page tried
  (homepage 200), so all URLs are Wayback. Several snapshots are truncated at about 1 MB: the starting_school_brochure_2021
  (2020 data) snapshot 20201021104054 is the only one, so primary 2020 is missing; full-size snapshots
  were picked for the rest. Gaps: primary 2019, 2020 and 2026; secondary 2019 and 2026. Search engines
  still index hf_secondary_outcomes_-_2019.pdf and sec_offer_outcomes_2021.pdf under section_attachments,
  but both return 404 live and are not in Wayback. The "how ... offered 2025" file sits in a 2025-02 folder
  but its numbers differ from the 2024 file, so it is treated as 2025 NOD.'
